replicaCount: 3

image:
  repository: sales-assistant
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

config:
  APP_ENV: production
  LOG_LEVEL: INFO
  HOST: 0.0.0.0
  PORT: "8000"
  AUTH_MODE: oidc
  MODEL_PROVIDER: openai_compatible
  REQUEST_TIMEOUT_SECONDS: "30"
  CONVERSATION_LEASE_SECONDS: "45"
  SSE_RETENTION_SECONDS: "600"

secret:
  existingSecret: sales-assistant-secrets

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 2

terminationGracePeriodSeconds: 60

topologySpreadConstraints:
  enabled: true

migration:
  enabled: false
  backoffLimit: 2

nodeSelector: {}
tolerations: []
affinity: {}
